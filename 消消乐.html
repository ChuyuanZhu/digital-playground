                        <body>
                            <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PIXEL CRUSH - 像素消消乐全功能版</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: "Courier New", "SimHei", monospace;
        }

        body {
            background-color: #121218;
            color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        /* 像素外壳容器 */
        .arcade-container {
            background-color: #242436;
            border: 4px solid #ffffff;
            box-shadow: 6px 6px 0px #050508;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* 标题像素字 */
        h1 {
            font-size: 24px;
            color: #ffe838;
            text-shadow: 3px 3px 0px #b85d00;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 2px;
        }

        /* 统一通用按钮 */
        .pixel-btn {
            background-color: #e63946;
            color: #fff;
            border: 3px solid #fff;
            box-shadow: 4px 4px 0px #000;
            font-size: 14px;
            font-weight: bold;
            padding: 10px 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            text-align: center;
            text-transform: uppercase;
        }

        .pixel-btn:hover { background-color: #ff4d5a; }
        .pixel-btn:active {
            box-shadow: 1px 1px 0px #000;
            transform: translate(3px, 3px);
        }
        .pixel-btn.secondary { background-color: #457b9d; }
        .pixel-btn.accent { background-color: #2a9d8f; }

        /* 视图面板控制 */
        .view-panel {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .view-panel.active { display: flex; }

        /* 规则/记录说明框 */
        .content-box {
            background: #111118;
            border: 3px solid #666;
            padding: 14px;
            width: 100%;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        /* 顶部仪表盘 HUD */
        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            background: #111118;
            border: 3px solid #787890;
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: bold;
        }
        .val { color: #00ffcc; }

        /* 棋盘画板通用 */
        .board-wrapper {
            position: relative;
            background-color: #16161f;
            border: 4px solid #505068;
            touch-action: none; /* 禁用系统手势以顺畅拖曳 */
            margin-bottom: 12px;
            overflow: hidden;
        }

        /* 原生像素模式网格 */
        #retroGrid {
            display: grid;
            gap: 4px;
            padding: 4px;
        }

        .retro-cell {
            border-radius: 0;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            box-shadow: inset -2px -2px 0px rgba(0,0,0,0.4), inset 2px 2px 0px rgba(255,255,255,0.4);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .retro-cell.selected {
            outline: 3px solid #fff;
            animation: blink 0.3s infinite alternate;
        }

        @keyframes blink {
            from { outline-color: #fff; }
            to { outline-color: #ff0055; }
        }

        /* 经典动画模式独立方块 */
        .animated-piece {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: inset -2px -2px 0px rgba(0,0,0,0.3), inset 2px 2px 0px rgba(255,255,255,0.4);
            border: 1px solid rgba(0,0,0,0.2);
            transition: left 0.2s cubic-bezier(0.25, 1, 0.5, 1),
                        top 0.2s cubic-bezier(0.25, 1, 0.5, 1),
                        transform 0.15s ease,
                        opacity 0.2s ease;
            cursor: grab;
            background-size: cover;
            background-position: center;
        }
        .animated-piece.eliminating {
            transform: scale(0) rotate(45deg);
            opacity: 0;
        }

        /* 5种色块预设 */
        .type-0 { background-color: #e63946; }
        .type-1 { background-color: #3a86ff; }
        .type-2 { background-color: #2a9d8f; }
        .type-3 { background-color: #ffb703; }
        .type-4 { background-color: #9d4edd; }

        /* 自定义设置表单 */
        .form-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 8px;
            align-items: center;
            font-size: 13px;
        }
        .form-row select, .form-row input[type="file"] {
            background: #111118;
            color: #fff;
            border: 2px solid #787890;
            padding: 4px;
            max-width: 60%;
        }

        .img-preview-group {
            display: flex;
            gap: 6px;
            margin: 8px 0;
        }
        .img-preview {
            width: 32px;
            height: 32px;
            border: 2px dashed #666;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>

<div class="arcade-container">

    <!-- 1. 主菜单界面 -->
    <div id="viewMenu" class="view-panel active">
        <h1>PIXEL CRUSH</h1>
        <button class="pixel-btn" onclick="startMode('retro')">像素点选模式</button>
        <button class="pixel-btn accent" onclick="startMode('classic')">经典滑动模式 (带动画)</button>
        <button class="pixel-btn secondary" onclick="switchView('viewCustom')">自定义模式设置</button>
        <button class="pixel-btn" style="background-color: #6a4c93;" onclick="switchView('viewRules')">玩法规则</button>
        <button class="pixel-btn" style="background-color: #3d5a80;" onclick="showRecords()">高分记录</button>
    </div>

    <!-- 2. 规则说明界面 -->
    <div id="viewRules" class="view-panel">
        <h1>玩法规则</h1>
        <div class="content-box">
            <p>1. <b>常规消除</b>：交换相邻图块，使横向或纵向达成 3 个或以上的连线即可消除。</p><br>
            <p>2. <b>像素模式</b>：点击选中方块，再点击相邻方块完成互换。</p><br>
            <p>3. <b>经典模式</b>：支持鼠标或手指直接<b>按住拖动</b>滑向相邻格子，配备平滑位移与粉碎消除特效。</p><br>
            <p>4. <b>连击加分</b>：单次移动引发多次连续下落消除，将触发额外 Combo 倍率加成！</p>
        </div>
        <button class="pixel-btn secondary" onclick="switchView('viewMenu')">返回主菜单</button>
    </div>

    <!-- 3. 记录查看界面 -->
    <div id="viewRecords" class="view-panel">
        <h1>排行榜记录</h1>
        <div class="content-box" id="recordsList">暂无记录</div>
        <button class="pixel-btn secondary" onclick="switchView('viewMenu')">返回主菜单</button>
    </div>

    <!-- 4. 自定义模式设置界面 -->
    <div id="viewCustom" class="view-panel">
        <h1>自定义棋盘</h1>
        <div class="content-box">
            <div class="form-row">
                <label>棋盘尺寸 (行 x 列):</label>
                <select id="customDim">
                    <option value="6">6 x 6 (简单)</option>
                    <option value="7">7 x 7</option>
                    <option value="8" selected>8 x 8 (标准)</option>
                    <option value="9">9 x 9</option>
                    <option value="10">10 x 10 (专家)</option>
                </select>
            </div>
            <div class="form-row" style="margin-top:10px;">
                <label>上传方块图片 (共5张):</label>
            </div>
            <input type="file" id="imgUpload" accept="image/*" multiple onchange="handleImageUpload(event)">
            <div class="img-preview-group" id="previewGroup">
                <div class="img-preview"></div>
                <div class="img-preview"></div>
                <div class="img-preview"></div>
                <div class="img-preview"></div>
                <div class="img-preview"></div>
            </div>
            <p style="font-size:11px; color:#aaa;">* 可单次选择 1~5 张本地图片。若未上传满 5 张，剩余图案保持像素预设。</p>
        </div>
        <button class="pixel-btn accent" onclick="startMode('custom')">应用并开始</button>
        <button class="pixel-btn secondary" onclick="switchView('viewMenu')">返回主菜单</button>
    </div>

    <!-- 5. 游戏界面（所有模式共享） -->
    <div id="viewGame" class="view-panel">
        <div class="hud">
            <span>MODE: <span id="hudMode" class="val">--</span></span>
            <span>SCORE: <span id="hudScore" class="val">0</span></span>
            <span>COMBO: <span id="hudCombo" class="val">x1</span></span>
        </div>

        <div class="board-wrapper" id="boardWrapper">
            <!-- 像素网格模式挂载点 -->
            <div id="retroGrid" style="display:none;"></div>
            <!-- 经典平滑动画模式挂载点 (由绝对定位元素填充) -->
        </div>

        <button class="pixel-btn secondary" onclick="exitToMenu()">返回菜单</button>
    </div>

</div>

<script>
    /* ========================= 全局变量与配置 ========================= */
    const ICONS = ['♥', '♦', '♣', '★', '▲'];
    let customImages = [null, null, null, null, null]; // 存储自定义Base64图案

    let currentMode = 'retro'; // 'retro' | 'classic' | 'custom'
    let ROWS = 8;
    let COLS = 8;
    const TYPES_COUNT = 5;

    let board = [];             // 逻辑二维阵列存储方块 type
    let pieces2D = [];          // 动画模式下 DOM 对象的映射
    let isProcessing = false;
    let currentScore = 0;

    // 获取 DOM 元素
    const boardWrapper = document.getElementById('boardWrapper');
    const retroGrid = document.getElementById('retroGrid');
    const hudMode = document.getElementById('hudMode');
    const hudScore = document.getElementById('hudScore');
    const hudCombo = document.getElementById('hudCombo');

    /* ========================= 界面导航与本地存储 ========================= */
    function switchView(viewId) {
        document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
    }

    function saveRecord(score, mode) {
        if (score <= 0) return;
        const records = JSON.parse(localStorage.getItem('pixel_match_records') || '[]');
        records.push({
            mode: mode.toUpperCase(),
            score: score,
            date: new Date().toLocaleString()
        });
        records.sort((a, b) => b.score - a.score);
        localStorage.setItem('pixel_match_records', JSON.stringify(records.slice(0, 10)));
    }

    function showRecords() {
        const records = JSON.parse(localStorage.getItem('pixel_match_records') || '[]');
        const listEl = document.getElementById('recordsList');
        if (records.length === 0) {
            listEl.innerHTML = '暂无历史战绩，赶快去挑战一把吧！';
        } else {
            listEl.innerHTML = records.map((r, i) => `
                <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                    <span>#${i+1} [${r.mode}]</span>
                    <span style="color:#00ffcc;">${r.score} PTS</span>
                </div>
            `).join('');
        }
        switchView('viewRecords');
    }

    function exitToMenu() {
        saveRecord(currentScore, currentMode);
        switchView('viewMenu');
    }

    /* ========================= 本地图片上传自定义处理 ========================= */
    function handleImageUpload(e) {
        const files = Array.from(e.target.files).slice(0, 5);
        const previewBoxes = document.querySelectorAll('#previewGroup .img-preview');
        
        previewBoxes.forEach(box => { box.style.backgroundImage = ''; });
        customImages = [null, null, null, null, null];

        files.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = function(evt) {
                customImages[index] = evt.target.result;
                previewBoxes[index].style.backgroundImage = `url(${evt.target.result})`;
            };
            reader.readAsDataURL(file);
        });
    }

    /* ========================= 游戏初始化入口 ========================= */
    function startMode(mode) {
        currentMode = mode;
        currentScore = 0;
        hudScore.innerText = currentScore;
        hudCombo.innerText = 'x1';
        hudMode.innerText = mode.toUpperCase();

        if (mode === 'custom') {
            const dim = parseInt(document.getElementById('customDim').value, 10);
            ROWS = COLS = dim;
        } else {
            ROWS = COLS = 8;
        }

        initLogicBoard();
        switchView('viewGame');

        if (mode === 'retro') {
            retroGrid.style.display = 'grid';
            initRetroBoard();
        } else {
            retroGrid.style.display = 'none';
            initClassicAnimatedBoard();
        }
    }

    // 初始化没有死局和现成消除的逻辑矩阵
    function initLogicBoard() {
        do {
            board = [];
            for (let r = 0; r < ROWS; r++) {
                board[r] = [];
                for (let c = 0; c < COLS; c++) {
                    board[r][c] = Math.floor(Math.random() * TYPES_COUNT);
                }
            }
        } while (findMatches().length > 0);
    }

    function sleep(ms) {
        return new Promise(res => setTimeout(res, ms));
    }

    /* ========================= 模式一：像素点选模式 ========================= */
    let retroSelected = null;

    function initRetroBoard() {
        const cellSize = Math.floor(Math.min(360 / COLS, 44));
        retroGrid.style.gridTemplateColumns = `repeat(${COLS}, ${cellSize}px)`;
        retroGrid.style.gridTemplateRows = `repeat(${ROWS}, ${cellSize}px)`;
        renderRetroBoard();
    }

    function renderRetroBoard() {
        retroGrid.innerHTML = '';
        const cellSize = Math.floor(Math.min(360 / COLS, 44));

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'retro-cell';
                cell.style.width = `${cellSize}px`;
                cell.style.height = `${cellSize}px`;
                
                const type = board[r][c];
                applyPieceAppearance(cell, type);

                if (retroSelected && retroSelected.r === r && retroSelected.c === c) {
                    cell.classList.add('selected');
                }

                cell.onclick = () => onRetroClick(r, c);
                retroGrid.appendChild(cell);
            }
        }
    }

    async function onRetroClick(r, c) {
        if (isProcessing) return;

        if (!retroSelected) {
            retroSelected = { r, c };
            renderRetroBoard();
        } else {
            const isAdjacent = Math.abs(retroSelected.r - r) + Math.abs(retroSelected.c - c) === 1;
            if (isAdjacent) {
                const r1 = retroSelected.r, c1 = retroSelected.c;
                retroSelected = null;
                renderRetroBoard();
                await trySwap(r1, c1, r, c, () => renderRetroBoard());
            } else {
                retroSelected = { r, c };
                renderRetroBoard();
            }
        }
    }

    /* ========================= 模式二 & 三：平滑滑动与动画模式 ========================= */
    let cellSize = 40;
    let dragStartX, dragStartY, activeRow, activeCol;
    let isDragging = false;

    function initClassicAnimatedBoard() {
        // 清理原有绝对定位方块
        boardWrapper.querySelectorAll('.animated-piece').forEach(el => el.remove());
        cellSize = Math.floor(Math.min(360 / COLS, 46));
        boardWrapper.style.width = `${cellSize * COLS}px`;
        boardWrapper.style.height = `${cellSize * ROWS}px`;

        pieces2D = [];
        for (let r = 0; r < ROWS; r++) {
            pieces2D[r] = [];
            for (let c = 0; c < COLS; c++) {
                const piece = createAnimatedPiece(r, c, board[r][c]);
                boardWrapper.appendChild(piece);
                pieces2D[r][c] = piece;
            }
        }

        // 绑定拖曳监听（同时支持触控与鼠标）
        boardWrapper.onpointerdown = handleDragStart;
        window.onpointermove = handleDragMove;
        window.onpointerup = handleDragEnd;
    }

    function createAnimatedPiece(r, c, type) {
        const piece = document.createElement('div');
        piece.className = 'animated-piece';
        piece.style.width = `${cellSize}px`;
        piece.style.height = `${cellSize}px`;
        applyPieceAppearance(piece, type);
        updatePiecePosition(piece, r, c);
        return piece;
    }

    function updatePiecePosition(piece, r, c) {
        piece.style.left = `${c * cellSize}px`;
        piece.style.top = `${r * cellSize}px`;
    }

    function applyPieceAppearance(element, type) {
        if (type === -1) {
            element.style.display = 'none';
            return;
        }
        element.style.display = 'flex';

        // 判断是否有对应的自定义图片
        if (customImages[type]) {
            element.className = element.className.replace(/type-\d/, '');
            element.style.backgroundImage = `url(${customImages[type]})`;
            element.innerText = '';
        } else {
            element.style.backgroundImage = '';
            element.className = element.className.replace(/type-\d/, '');
            element.classList.add(`type-${type}`);
            element.innerText = ICONS[type];
        }
    }

    // 拖拽手势判断
    function handleDragStart(e) {
        if (isProcessing) return;
        const rect = boardWrapper.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        activeCol = Math.floor(x / cellSize);
        activeRow = Math.floor(y / cellSize);

        if (activeRow >= 0 && activeRow < ROWS && activeCol >= 0 && activeCol < COLS) {
            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
        }
    }

    function handleDragMove(e) {
        if (!isDragging || isProcessing) return;
        const deltaX = e.clientX - dragStartX;
        const deltaY = e.clientY - dragStartY;
        const threshold = cellSize * 0.4; // 拖动触发阈值

        if (Math.abs(deltaX) > threshold || Math.abs(deltaY) > threshold) {
            isDragging = false;
            let targetR = activeRow;
            let targetC = activeCol;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                targetC += (deltaX > 0) ? 1 : -1;
            } else {
                targetR += (deltaY > 0) ? 1 : -1;
            }

            if (targetR >= 0 && targetR < ROWS && targetC >= 0 && targetC < COLS) {
                executeAnimatedSwap(activeRow, activeCol, targetR, targetC);
            }
        }
    }

    function handleDragEnd() {
        isDragging = false;
    }

    async function executeAnimatedSwap(r1, c1, r2, c2) {
        isProcessing = true;

        // 1. 交换视觉 DOM 坐标
        const p1 = pieces2D[r1][c1];
        const p2 = pieces2D[r2][c2];

        updatePiecePosition(p1, r2, c2);
        updatePiecePosition(p2, r1, c1);

        pieces2D[r1][c1] = p2;
        pieces2D[r2][c2] = p1;

        // 2. 交换矩阵数据
        const temp = board[r1][c1];
        board[r1][c1] = board[r2][c2];
        board[r2][c2] = temp;

        await sleep(220); // 留出 CSS 过渡时间

        let matches = findMatches();
        if (matches.length > 0) {
            // 成功匹配，开始级联动画
            let comboCount = 1;
            while (matches.length > 0) {
                hudCombo.innerText = `x${comboCount}`;
                await handleAnimatedElimination(matches, comboCount);
                await handleAnimatedGravity();
                matches = findMatches();
                if (matches.length > 0) comboCount++;
            }
            hudCombo.innerText = 'x1';
        } else {
            // 无法消除，回滚动画
            updatePiecePosition(p1, r1, c1);
            updatePiecePosition(p2, r2, c2);
            pieces2D[r1][c1] = p1;
            pieces2D[r2][c2] = p2;
            board[r2][c2] = board[r1][c1];
            board[r1][c1] = temp;
            await sleep(200);
        }

        isProcessing = false;
    }

    // 经典模式消除动画
    async function handleAnimatedElimination(matches, combo) {
        currentScore += matches.length * 10 * combo;
        hudScore.innerText = currentScore;

        matches.forEach(({ r, c }) => {
            board[r][c] = -1;
            if (pieces2D[r][c]) {
                pieces2D[r][c].classList.add('eliminating');
            }
        });

        await sleep(200);

        matches.forEach(({ r, c }) => {
            if (pieces2D[r][c]) {
                pieces2D[r][c].remove();
                pieces2D[r][c] = null;
            }
        });
    }

    // 经典模式重力下落与新块平滑生成
    async function handleAnimatedGravity() {
        // 下落现有方块
        for (let c = 0; c < COLS; c++) {
            let emptyRow = ROWS - 1;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r][c] !== -1) {
                    if (emptyRow !== r) {
                        board[emptyRow][c] = board[r][c];
                        board[r][c] = -1;
                        pieces2D[emptyRow][c] = pieces2D[r][c];
                        pieces2D[r][c] = null;
                        updatePiecePosition(pieces2D[emptyRow][c], emptyRow, c);
                    }
                    emptyRow--;
                }
            }

            // 顶部生成新块并附带下落位移动画
            let fallOffset = 1;
            for (let r = emptyRow; r >= 0; r--) {
                const newType = Math.floor(Math.random() * TYPES_COUNT);
                board[r][c] = newType;

                const piece = createAnimatedPiece(-fallOffset, c, newType);
                boardWrapper.appendChild(piece);
                pieces2D[r][c] = piece;

                // 强制触发重绘后再赋予最终下落位置，展示下落过渡
                piece.getBoundingClientRect();
                updatePiecePosition(piece, r, c);
                fallOffset++;
            }
        }
        await sleep(250);
    }

    /* ========================= 核心通用算法与逻辑 ========================= */
    async function trySwap(r1, c1, r2, c2, renderCallback) {
        isProcessing = true;
        
        let temp = board[r1][c1];
        board[r1][c1] = board[r2][c2];
        board[r2][c2] = temp;
        renderCallback();

        let matches = findMatches();
        if (matches.length > 0) {
            let comboCount = 1;
            while (matches.length > 0) {
                hudCombo.innerText = `x${comboCount}`;
                currentScore += matches.length * 10 * comboCount;
                hudScore.innerText = currentScore;

                matches.forEach(({ r, c }) => { board[r][c] = -1; });
                renderCallback();
                await sleep(250);

                // 重力下落填补
                for (let c = 0; c < COLS; c++) {
                    let emptyRow = ROWS - 1;
                    for (let r = ROWS - 1; r >= 0; r--) {
                        if (board[r][c] !== -1) {
                            if (emptyRow !== r) {
                                board[emptyRow][c] = board[r][c];
                                board[r][c] = -1;
                            }
                            emptyRow--;
                        }
                    }
                    for (let r = emptyRow; r >= 0; r--) {
                        board[r][c] = Math.floor(Math.random() * TYPES_COUNT);
                    }
                }
                renderCallback();
                await sleep(200);

                matches = findMatches();
                if (matches.length > 0) comboCount++;
            }
            hudCombo.innerText = 'x1';
        } else {
            await sleep(200);
            temp = board[r1][c1];
            board[r1][c1] = board[r2][c2];
            board[r2][c2] = temp;
            renderCallback();
        }

        isProcessing = false;
    }

    function findMatches() {
        let matched = new Set();

        // 水平连线匹配
        for (let r = 0; r < ROWS; r++) {
            let count = 1;
            for (let c = 0; c < COLS; c++) {
                if (c < COLS - 1 && board[r][c] !== -1 && board[r][c] === board[r][c + 1]) {
                    count++;
                } else {
                    if (count >= 3) {
                        for (let k = 0; k < count; k++) matched.add(`${r},${c - k}`);
                    }
                    count = 1;
                }
            }
        }

        // 垂直连线匹配
        for (let c = 0; c < COLS; c++) {
            let count = 1;
            for (let r = 0; r < ROWS; r++) {
                if (r < ROWS - 1 && board[r][c] !== -1 && board[r][c] === board[r + 1][c]) {
                    count++;
                } else {
                    if (count >= 3) {
                        for (let k = 0; k < count; k++) matched.add(`${r - k},${c}`);
                    }
                    count = 1;
                }
            }
        }

        return Array.from(matched).map(coord => {
            const [r, c] = coord.split(',').map(Number);
            return { r, c };
        });
    }
